name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Test
        run: dotnet test tests/InControl.Core.Tests/InControl.Core.Tests.csproj --configuration Release --nologo
      - name: Vulnerable packages
        run: dotnet list tests/InControl.Core.Tests/InControl.Core.Tests.csproj package --vulnerable --include-transitive
