# InControl signed package. workflow_dispatch only. A tag does not start this.
# No signing certificate is stored in this repository, and no MSIX is committed.
#
# The Store already has identity Name mcp-tool-shop.InControl-Desktop through version 1.4.0.0.
# This workflow packs that same name. The package version is four numbers,
# starting at 2.0.0.0. Publisher is the signing certificate subject and has
# to match the 1.4.0 upload. Run this only when that certificate is configured.
#
# Prerequisites:
# - SIGNING_CERTIFICATE_BASE64: Base64-encoded PFX
# - SIGNING_CERTIFICATE_PASSWORD: PFX password

name: Signed Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without v prefix)'
        required: true
        type: string
      sign:
        description: 'Sign the package'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '9.0.x'
  CONFIGURATION: Release
  RUNTIME: win-x64

jobs:
  # Verify we're on a release branch
  verify:
    name: Verify Release Conditions
    runs-on: ubuntu-latest
    outputs:
      should_sign: ${{ steps.check.outputs.should_sign }}

    steps:
      - name: Check Signing Conditions
        id: check
        run: |
          # Sign if: triggered by tag on main, or manual with sign=true
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_sign=true" >> $GITHUB_OUTPUT
            echo "Signing enabled: tag push"
          elif [[ "${{ github.event.inputs.sign }}" == "true" ]]; then
            echo "should_sign=true" >> $GITHUB_OUTPUT
            echo "Signing enabled: manual trigger"
          else
            echo "should_sign=false" >> $GITHUB_OUTPUT
            echo "Signing disabled"
          fi

  build:
    name: Build & Test
    runs-on: windows-latest
    needs: verify

    outputs:
      version: ${{ steps.version.outputs.version }}
      version_suffix: ${{ steps.version.outputs.suffix }}
      commit_short: ${{ steps.metadata.outputs.commit_short }}
      msix_version: ${{ steps.version.outputs.msix_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract Version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event.inputs.version }}') {
            $version = '${{ github.event.inputs.version }}'
          } else {
            $tag = '${{ github.ref_name }}'
            $version = $tag -replace '^v', ''
          }

          if ($version -match '-') {
            Write-Error "Partner Center versions are four numbers. A prerelease suffix cannot be uploaded. Got: $version"
            exit 1
          }

          $parts = @($version -split '\.')
          if ($parts.Count -lt 2 -or $parts.Count -gt 4) {
            Write-Error "Invalid version format: $version. Use 2.0.0. The manifest version becomes 2.0.0.0."
            exit 1
          }

          $nums = New-Object System.Collections.Generic.List[int]
          foreach ($part in $parts) {
            if ($part -notmatch '^\d+$') {
              Write-Error "Invalid version format: $version. Use 2.0.0. The manifest version becomes 2.0.0.0."
              exit 1
            }
            $n = [int]$part
            if ($n -lt 0 -or $n -gt 65535) {
              Write-Error "Version part out of range (0-65535): $part"
              exit 1
            }
            $nums.Add($n)
          }
          while ($nums.Count -lt 4) { $nums.Add(0) }

          $msix = ($nums[0..3] -join '.')
          if ([version]$msix -lt [version]'2.0.0.0') {
            Write-Error "Package version $msix is below 2.0.0.0. The Store already has mcp-tool-shop.InControl-Desktop through 1.4.0.0, so this package starts at 2.0.0.0."
            exit 1
          }

          $semver = '{0}.{1}.{2}' -f $nums[0], $nums[1], $nums[2]
          echo "version=$semver" >> $env:GITHUB_OUTPUT
          echo "base=$semver" >> $env:GITHUB_OUTPUT
          echo "suffix=" >> $env:GITHUB_OUTPUT
          echo "msix_version=$msix" >> $env:GITHUB_OUTPUT

      - name: Generate Metadata
        id: metadata
        shell: pwsh
        run: |
          $commitShort = '${{ github.sha }}'.Substring(0, 8)
          echo "commit_short=$commitShort" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build
        run: |
          dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:InformationalVersion=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.msix_version }} `
            -p:FileVersion=${{ steps.version.outputs.msix_version }}

      - name: Test
        run: dotnet test --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

      - name: Publish
        run: |
          dotnet publish src/InControl.App/InControl.App.csproj `
            --configuration ${{ env.CONFIGURATION }} `
            --runtime ${{ env.RUNTIME }} `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:InformationalVersion=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.msix_version }} `
            -p:FileVersion=${{ steps.version.outputs.msix_version }} `
            --output ./publish

      - name: Generate Build Provenance
        shell: pwsh
        run: |
          $provenance = @{
            format = 'incontrol-provenance-v1'
            version = '${{ steps.version.outputs.version }}'
            build = @{
              number = ${{ github.run_number }}
              id = '${{ github.run_id }}'
              timestamp = (Get-Date -Format 'o')
            }
            source = @{
              repository = '${{ github.repository }}'
              commit = '${{ github.sha }}'
              commitShort = '${{ steps.metadata.outputs.commit_short }}'
              ref = '${{ github.ref }}'
              refName = '${{ github.ref_name }}'
            }
            runner = @{
              os = '${{ runner.os }}'
              arch = '${{ runner.arch }}'
            }
            workflow = @{
              name = '${{ github.workflow }}'
              file = '${{ github.workflow_ref }}'
            }
          }

          $provenance | ConvertTo-Json -Depth 10 | Out-File -FilePath ./publish/provenance.json -Encoding utf8

          Write-Host "Build provenance:"
          $provenance | ConvertTo-Json -Depth 10

      - name: Upload Build Output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: ./publish
          retention-days: 7

  sign-and-package:
    name: Sign & Package
    runs-on: windows-latest
    needs: [verify, build]
    if: needs.verify.outputs.should_sign == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Build Output
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: build-output
          path: ./publish

      - name: Setup Signing Certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERTIFICATE_BASE64) {
            Write-Error "Signing certificate not configured"
            exit 1
          }

          $certBytes = [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
          $certPath = "$env:RUNNER_TEMP\signing-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          echo "CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Create MSIX Manifest
        shell: pwsh
        run: |
          $msixVersion = '${{ needs.build.outputs.msix_version }}'
          if ($msixVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            Write-Error "MSIX version must be four numbers. Got: $msixVersion"
            exit 1
          }

          # The manifest publisher is the Partner Center account publisher.
          # A certificate with any other subject is not uploadable.
          $expectedPublisher = 'CN=5305D976-6952-4F00-9C21-3A5DB090359F'
          $certPath = $env:CERT_PATH
          $certPassword = '${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}'
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($certPath, $certPassword)
          $publisher = $cert.Subject

          Write-Host "Publisher: $publisher"
          Write-Host "MSIX Version: $msixVersion"

          if ($publisher -ne $expectedPublisher) {
            Write-Error "Signing certificate subject is '$publisher'. Partner Center requires $expectedPublisher."
            exit 1
          }

          $manifest = Get-Content -Path packaging/AppxManifest.template.xml -Raw
          if ($manifest -notmatch 'Name="mcp-tool-shop\.InControl-Desktop"') {
            Write-Error "MSIX identity Name must stay mcp-tool-shop.InControl-Desktop. Partner Center rejects a different package name."
            exit 1
          }
          if ($manifest -notmatch [regex]::Escape("Publisher=`"$expectedPublisher`"")) {
            Write-Error "MSIX identity Publisher must stay $expectedPublisher."
            exit 1
          }
          $manifest = $manifest -replace '\$\{VERSION\}', $msixVersion
          if ($manifest -match '\$\{PUBLISHER\}' -or $manifest -notmatch "Version=`"$msixVersion`"") {
            Write-Error "Manifest identity was not filled. Name mcp-tool-shop.InControl-Desktop, version $msixVersion, and publisher $expectedPublisher are all required."
            exit 1
          }
          $manifest | Out-File -FilePath ./publish/AppxManifest.xml -Encoding utf8

      - name: Create MSIX Package
        shell: pwsh
        run: |
          $msixVersion = '${{ needs.build.outputs.msix_version }}'
          $makeappx = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
            Select-Object -First 1

          New-Item -ItemType Directory -Force -Path ./artifacts | Out-Null
          $outputPath = "./artifacts/mcp-tool-shop.InControl-Desktop_${msixVersion}_x64.msix"

          & $makeappx.FullName pack /d ./publish /p $outputPath /nv

          if ($LASTEXITCODE -ne 0) {
            Write-Error "makeappx failed"
            exit 1
          }

          echo "MSIX_PATH=$outputPath" >> $env:GITHUB_ENV

      - name: Sign MSIX Package
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
            Select-Object -First 1

          Write-Host "Signing with: $($signtool.FullName)"

          & $signtool.FullName sign `
            /fd SHA256 `
            /f $env:CERT_PATH `
            /p $env:SIGNING_CERTIFICATE_PASSWORD `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            $env:MSIX_PATH

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Signing failed"
            exit 1
          }

          Write-Host "✅ Package signed successfully"

      - name: Verify Signature
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
            Select-Object -First 1

          & $signtool.FullName verify /pa /v $env:MSIX_PATH

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Signature verification failed"
            exit 1
          }

          Write-Host "✅ Signature verified"

      - name: Generate Checksums
        shell: pwsh
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $checksumFile = "./artifacts/checksums-$version.txt"

          Get-ChildItem -Path ./artifacts -Filter *.msix | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath $checksumFile -Append -Encoding utf8
          }

          Write-Host "Checksums:"
          Get-Content $checksumFile

      - name: Generate Signature Info
        shell: pwsh
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $msixVersion = '${{ needs.build.outputs.msix_version }}'

          $sigInfo = @{
            signed = $true
            signedAt = (Get-Date -Format 'o')
            algorithm = 'SHA256'
            timestampServer = 'http://timestamp.digicert.com'
            packageFile = "mcp-tool-shop.InControl-Desktop_${msixVersion}_x64.msix"
          }

          $sigInfo | ConvertTo-Json | Out-File -FilePath "./artifacts/signature-info-$version.json" -Encoding utf8

      - name: Cleanup Certificate
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:CERT_PATH) {
            Remove-Item -Path $env:CERT_PATH -Force
          }

      - name: Upload Signed Package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-signed
          path: |
            artifacts/*.msix
            artifacts/checksums-*.txt
            artifacts/signature-info-*.json
          retention-days: 90

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, sign-and-package]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Signed Package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-package-signed
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: InControl v${{ needs.build.outputs.version }}
          draft: true
          prerelease: ${{ needs.build.outputs.version_suffix != '' }}
          generate_release_notes: true
          files: |
            artifacts/*.msix
            artifacts/checksums-*.txt
            artifacts/signature-info-*.json
          body: |
            ## InControl v${{ needs.build.outputs.version }}

            Package identity `mcp-tool-shop.InControl-Desktop`, version `${{ needs.build.outputs.msix_version }}`. That file is the Partner Center upload. It is not a Store listing by itself.

            ### Installation

            1. Download `mcp-tool-shop.InControl-Desktop_${{ needs.build.outputs.msix_version }}_x64.msix`
            2. Verify the SHA256 checksum (see `checksums-${{ needs.build.outputs.version }}.txt`)
            3. Double-click to install

            ### Verification

            #### Verify Checksum
            ```powershell
            $expected = (Get-Content checksums-${{ needs.build.outputs.version }}.txt | Select-String 'mcp-tool-shop.InControl-Desktop_').ToString().Split(' ')[0]
            $actual = (Get-FileHash mcp-tool-shop.InControl-Desktop_${{ needs.build.outputs.msix_version }}_x64.msix -Algorithm SHA256).Hash.ToLower()
            if ($expected -eq $actual) { Write-Host "Checksum verified" } else { Write-Host "Checksum mismatch" }
            ```

            #### Verify Signature
            ```powershell
            signtool verify /pa mcp-tool-shop.InControl-Desktop_${{ needs.build.outputs.msix_version }}_x64.msix
            ```

            ### Build Information

            | Property | Value |
            |----------|-------|
            | Commit | `${{ needs.build.outputs.commit_short }}` |
            | Full SHA | `${{ github.sha }}` |
            | Build | #${{ github.run_number }} |
            | Signed | ✅ Yes |
