# Source release check. A tag runs the same library tests as CI.
# There is no MSIX in this repository. The GitHub release is cut with
# gh release create and does not attach an installer.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test the tagged tree
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 9.0.x
      - name: Test
        run: dotnet test tests/InControl.Core.Tests/InControl.Core.Tests.csproj --configuration Release --nologo
