name: Publish to NuGet

# Library publish is manual. A GitHub release of the app must not push
# InControl.Core or InControl.Inference. Those ids are already on NuGet
# at 1.2.2 and 1.0.2, and this repo does not republish them.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: |
          dotnet restore src/InControl.Core/InControl.Core.csproj
          dotnet restore src/InControl.Inference/InControl.Inference.csproj

      - name: Build
        run: |
          dotnet build src/InControl.Core/InControl.Core.csproj --configuration Release --no-restore
          dotnet build src/InControl.Inference/InControl.Inference.csproj --configuration Release --no-restore

      - name: Pack InControl.Core
        run: dotnet pack src/InControl.Core/InControl.Core.csproj --configuration Release --no-build --output ./nupkg

      - name: Pack InControl.Inference
        run: dotnet pack src/InControl.Inference/InControl.Inference.csproj --configuration Release --no-build --output ./nupkg

      - name: Login to NuGet (Trusted Publishing)
        uses: nuget/login@v1
        id: nuget-login
        with:
          user: mcp-tool-shop

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
