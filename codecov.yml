# Patch coverage is the bar. A pull request fails when the lines it changed
# are under 90% covered. The repository-wide percentage stays informational:
# the WinUI app is not in this report, and a hard project gate would fail a
# tree whose library coverage is still climbing.
coverage:
  status:
    project:
      default:
        target: 90%
        informational: true
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  hide_project_coverage: true
  require_changes: false
